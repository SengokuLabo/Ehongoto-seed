openapi: 3.0.3

info:
  title: 絵本メーカー API
  version: 1.0.0
  description: |
    wix → 絵本メーカー間のAPI仕様。
    詳細は docs/api-design.md を参照。

servers:
  - url: http://localhost/api
    description: 開発環境
  - url: https://maker.ehongoto.jp/api
    description: 本番環境

# =====================
# セキュリティスキーマ
# =====================
components:
  securitySchemes:
    WixApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    WixTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp

  # =====================
  # 共通スキーマ
  # =====================
  schemas:

    # エラー
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: invalid_token
        message:
          type: string
          example: このリンクは無効または期限切れです

    # 顔パーツ1件
    FacePart:
      type: object
      required: [id, img_path]
      properties:
        id:
          type: integer
          example: 1
        img_path:
          type: string
          example: /media/face/hair_1.png

    # イラスト1パターン
    ImagePattern:
      type: object
      required: [img_id, img_path]
      properties:
        img_id:
          type: integer
          example: 1
        img_path:
          type: string
          example: /media/images/p1_1.png

    # ページ（生成時レスポンス）
    GeneratedPage:
      type: object
      required: [page_num, text]
      properties:
        page_num:
          type: integer
          example: 1
        text:
          type: string
          example: むかしむかし、たろうは...

    # ページ（決済リクエスト）
    PaymentPage:
      type: object
      required: [page_num, text, img_id]
      properties:
        page_num:
          type: integer
          example: 1
        text:
          type: string
          example: むかしむかし、たろうは...
        img_id:
          type: integer
          example: 2

    # ページ（購入済みレスポンス）
    BookPage:
      type: object
      required: [page_num, text, img_path]
      properties:
        page_num:
          type: integer
          example: 1
        text:
          type: string
          example: むかしむかし、たろうは...
        img_path:
          type: string
          example: /media/images/p1_2.png

    # 顔パーツ選択（決済リクエスト）
    FaceSelection:
      type: object
      required: [hair, eye, nose, mouth]
      properties:
        hair:
          type: integer
          example: 2
        eye:
          type: integer
          example: 1
        nose:
          type: integer
          example: 3
        mouth:
          type: integer
          example: 2

    # 顔パーツ（購入済みレスポンス）
    FaceResolved:
      type: object
      required: [hair, eye, nose, mouth]
      properties:
        hair:
          type: string
          example: /media/face/hair_2.png
        eye:
          type: string
          example: /media/face/eye_1.png
        nose:
          type: string
          example: /media/face/nose_3.png
        mouth:
          type: string
          example: /media/face/mouth_2.png

    # 購入者情報
    Buyer:
      type: object
      required: [name, email, phone]
      properties:
        name:
          type: string
          example: 山田 花子
        email:
          type: string
          format: email
          example: hanako@example.com
        phone:
          type: string
          example: 090-1234-5678
        post:
          type: string
          example: 123-4567
          description: 製本時のみ必須
        ship_addr:
          type: string
          example: 東京都渋谷区〇〇1-2-3
          description: 製本時のみ必須
        mail_ok:
          type: boolean
          example: true
          description: メール告知のopt-in

# =====================
# エンドポイント
# =====================
paths:

  /:
    get:
      summary: ヘルスチェック
      description: サーバーの起動確認用。
      responses:
        '200':
          description: 正常稼働中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /generate:
    post:
      summary: AI文章生成・素材一覧取得
      description: |
        wixフォームの回答を受け取り、AI文章生成と顔パーツ・イラスト一覧を返す。
        X-Api-Key と X-Timestamp によるwix認証が必要。
      security:
        - WixApiKey: []
          WixTimestamp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme, answers]
              properties:
                theme:
                  type: string
                  example: life_timeline
                  description: テーマ識別子
                answers:
                  type: object
                  description: wixフォームの回答（q1, q2... の連番キー）
                  example:
                    q1: 絵を描くこと
                    q2: じっとしていられない
                    q3: いつも笑顔でいてくれてありがとう
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                type: object
                required: [title, pages, face_parts, images]
                properties:
                  title:
                    type: string
                    example: たろうのだいぼうけん
                  pages:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeneratedPage'
                  face_parts:
                    type: object
                    properties:
                      hair:
                        type: array
                        items:
                          $ref: '#/components/schemas/FacePart'
                      eye:
                        type: array
                        items:
                          $ref: '#/components/schemas/FacePart'
                      nose:
                        type: array
                        items:
                          $ref: '#/components/schemas/FacePart'
                      mouth:
                        type: array
                        items:
                          $ref: '#/components/schemas/FacePart'
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        page_num:
                          type: integer
                        patterns:
                          type: array
                          items:
                            $ref: '#/components/schemas/ImagePattern'
        '401':
          description: 認証失敗（APIキー不正 or タイムスタンプ期限切れ）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized
                message: 認証に失敗しました
        '500':
          description: AI生成失敗（リトライ後も失敗）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: generation_failed
                message: エラーが発生しました。最初からやり直してください

  /payment:
    post:
      summary: Square Checkout URL発行
      description: |
        絵本データを受け取り、Square Checkout URLを返す。
        カード情報・住所などの購入者情報はすべてSquare側で収集するため、このエンドポイントには含まない。
        金額はサーバー側で固定（pdf=300円 / print=3000円）。
        サーバーはUUID tokenを生成し、Square CheckoutのreferenceIdに紐づける。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, theme, title, buyer, face, pages]
              properties:
                type:
                  type: string
                  enum: [pdf, print]
                  example: pdf
                theme:
                  type: string
                  example: life_timeline
                title:
                  type: string
                  example: たろうのだいぼうけん
                buyer:
                  $ref: '#/components/schemas/Buyer'
                  description: |
                    カード情報を除く購入者情報。
                    post / ship_addr は type=print のみ必須。
                face:
                  $ref: '#/components/schemas/FaceSelection'
                pages:
                  type: array
                  items:
                    $ref: '#/components/schemas/PaymentPage'
      responses:
        '200':
          description: Checkout URL発行成功
          content:
            application/json:
              schema:
                type: object
                required: [checkout_url]
                properties:
                  checkout_url:
                    type: string
                    format: uri
                    description: Square Checkoutのホスト画面URL。フロントはこのURLへリダイレクトする。
                    example: https://checkout.square.site/pay/xxxxxxxx
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: validation_error
                message: 必須項目が不足しています
        '500':
          description: Checkout URL発行失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: checkout_failed
                message: 決済画面の準備に失敗しました。再度お試しください

  /payment/callback:
    post:
      summary: Square Webhook受け口
      description: |
        Square決済完了後にSquareがPOSTするWebhook。
        このエンドポイントでDB保存・PDF生成・メール送信を行う。
        referenceIdからtokenを取得し、絵本データと購入者情報（Square提供）を保存する。
        Square側の署名検証（X-Square-Hmacsha256-Signature）を必ず行う。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Squareが送信するWebhookペイロード（Square仕様に準拠）
              properties:
                type:
                  type: string
                  example: payment.completed
                data:
                  type: object
                  description: 決済情報（referenceId・購入者情報・金額など）
      responses:
        '200':
          description: 処理成功（Squareへの応答）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: 署名検証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_signature
                message: Webhook署名の検証に失敗しました

  /books/{token}:
    get:
      summary: 購入済み絵本データ取得
      description: tokenで絵本データを取得する。有効期限切れの場合は404。
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            format: uuid
          example: a3f8b2c1-4d5e-6f7a-8b9c-0d1e2f3a4b5c
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                required: [title, status, pdf_exp, face, pages]
                properties:
                  title:
                    type: string
                    example: たろうのだいぼうけん
                  status:
                    type: string
                    enum: [paid, expired, ordered]
                    example: paid
                  pdf_exp:
                    type: string
                    format: date-time
                    example: '2026-05-15T00:00:00+09:00'
                  face:
                    $ref: '#/components/schemas/FaceResolved'
                  pages:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookPage'
        '404':
          description: token不正 or 期限切れ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_token
                message: このリンクは無効または期限切れです

  /books/{token}/pdf:
    get:
      summary: PDFダウンロードURL取得
      description: |
        PDFの署名付きダウンロードURLを返す。
        URLの有効期限は1時間。絵本自体の有効期限（30日）が切れている場合は404。
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            format: uuid
          example: a3f8b2c1-4d5e-6f7a-8b9c-0d1e2f3a4b5c
      responses:
        '200':
          description: URL取得成功
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url:
                    type: string
                    format: uri
                    example: https://maker.ehongoto.jp/media/pdfs/xxx.pdf?token=...
                  expires_at:
                    type: string
                    format: date-time
                    description: URLの有効期限（1時間）
                    example: '2026-04-16T11:00:00+09:00'
        '404':
          description: token不正 or 絵本の有効期限切れ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: expired
                message: ダウンロード期限が切れています。再購入をお願いします
